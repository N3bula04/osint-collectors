[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-collectors"
version = "0.1.0"
description = "Cached, rate-limit-aware collectors for public DNS, certificate transparency (crt.sh) and RDAP data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jeremy" }]
dependencies = [
    "dnspython>=2.6,<3",
    "requests>=2.31,<3",
    "tldextract>=5.1,<6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pyflakes==3.2.0"]

[project.urls]
Source = "https://github.com/N3bula04/osint-collectors"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: smoke tests against public providers (opt in)"]
